# The app's checks.
#
# The server and the web app generate code from graphnous-schemas. Each job
# checks it out from the repository the app came from (the
# GRAPHNOUS_REPOSITORY variable, by default graphnous/Graphnous-2) at the
# workspace's root, and the app into graphnous-app next to it: the layout
# the app's relative paths expect. That repository is private, so this needs
# a GRAPHNOUS_TOKEN secret that can read its contents.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    name: Server
    runs-on: ubuntu-latest
    steps:
      - name: Check out the schemas
        uses: actions/checkout@v4
        with:
          repository: graphnous/graphnous-schemas
          path: graphnous-schemas

      - name: Check out the app
        uses: actions/checkout@v4
        with:
          path: graphnous-app

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      # The tests that need Docker use the runner's daemon
      - run: mvn -B -f graphnous-app/server/pom.xml verify

  web:
    name: Web app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: graphnous-app/web
    steps:
      - name: Check out the app
        uses: actions/checkout@v4
        with:
          path: graphnous-app

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: graphnous-app/web/package-lock.json

      # OpenAPI Generator, which generates the API client, runs on Java
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - run: npm ci

      - run: npm run lint

      # Generates the API client first, and typechecks
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      # Every story as a test, with its accessibility checks, in light and
      # in dark
      - run: npx playwright install --with-deps chromium
      - run: npm run test:storybook

  image:
    name: Server image
    runs-on: ubuntu-latest
    steps:
      - name: Check out the schemas
        uses: actions/checkout@v4
        with:
          repository: graphnous/graphnous-typescript-scanner
          token: ${{ secrets.GRAPHNOUS_TOKEN }}
          sparse-checkout: graphnous-schemas

      - name: Check out the app
        uses: actions/checkout@v4
        with:
          path: graphnous-app

      - uses: docker/setup-buildx-action@v3

      # From the workspace's root, with the app and its sibling repositories
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: graphnous-app/server/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
