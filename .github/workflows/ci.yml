# The app's checks.
#
# The app builds on its sibling repositories: the server generates code from
# graphnous/graphnous-schemas, and the server's image bundles
# graphnous/graphnous-java-scanner and graphnous/graphnous-typescript-scanner.
# Each job checks out what it needs at the workspace's root, and the app into
# graphnous-app next to them: the layout the app's relative paths expect.
# The OpenAPI spec is downloaded from GitHub Pages. The scanners are private,
# so the image job needs a GRAPHNOUS_TOKEN secret that can read their
# contents.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    name: Server
    runs-on: ubuntu-latest
    steps:
      - name: Check out the schemas
        uses: actions/checkout@v4
        with:
          repository: graphnous/graphnous-schemas
          path: graphnous-schemas

      - name: Check out the app
        uses: actions/checkout@v4
        with:
          path: graphnous-app

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      # The tests that need Docker use the runner's daemon
      - run: mvn -B -f graphnous-app/server/pom.xml verify

  web:
    name: Web app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: graphnous-app/web
    steps:
      - name: Check out the app
        uses: actions/checkout@v4
        with:
          path: graphnous-app

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: graphnous-app/web/package-lock.json

      # OpenAPI Generator, which generates the API client, runs on Java
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - run: npm ci

      - run: npm run lint

      # Generates the API client first, and typechecks
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      # Every story as a test, with its accessibility checks, in light and
      # in dark
      - run: npx playwright install --with-deps chromium
      - run: npm run test:storybook

  image:
    name: Server image
    runs-on: ubuntu-latest
    steps:
      - name: Check out the schemas
        uses: actions/checkout@v4
        with:
          repository: graphnous/graphnous-schemas
          path: graphnous-schemas

      - name: Check out the Java scanner
        uses: actions/checkout@v4
        with:
          repository: graphnous/graphnous-java-scanner
          token: ${{ secrets.GRAPHNOUS_TOKEN }}
          path: graphnous-java-scanner

      - name: Check out the TypeScript scanner
        uses: actions/checkout@v4
        with:
          repository: graphnous/graphnous-typescript-scanner
          token: ${{ secrets.GRAPHNOUS_TOKEN }}
          path: graphnous-typescript-scanner

      - name: Check out the app
        uses: actions/checkout@v4
        with:
          path: graphnous-app

      - uses: docker/setup-buildx-action@v3

      # From the workspace's root, with the app and its sibling repositories
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: graphnous-app/server/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
