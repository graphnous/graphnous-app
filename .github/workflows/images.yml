# Publishes the Docker images of the server and the web app to the GitHub
# Container Registry: ghcr.io/graphnous/graphnous-server and
# ghcr.io/graphnous/graphnous-web.
#
# A push to main publishes them as edge; a tag vX.Y.Z as X.Y.Z, X.Y and
# latest. CI builds both images on every pull request, so this only builds
# what CI has built before.

name: Publish images

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  server:
    name: Server image
    runs-on: ubuntu-latest
    steps:
      # The server generates code from the schemas next to the app, at the
      # commit CI checks it with (SCHEMAS_REF in ci.yml)
      - name: Check out the schemas
        uses: actions/checkout@v4
        with:
          repository: graphnous/graphnous-schemas
          ref: de56548fb53cc74a50daa9818c3b36ecdf192d97
          path: graphnous-schemas

      - name: Check out the app
        uses: actions/checkout@v4
        with:
          path: graphnous-app

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/graphnous-server
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # From the workspace's root, with the schemas next to the app
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: graphnous-app/server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  web:
    name: Web app image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/graphnous-web
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: web
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
