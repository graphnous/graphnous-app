# The MCP server's defaults, which the application's own configuration
# overrides. Stateless: a call needs no session, and is made as the caller
# of its request
spring.ai.mcp.server.protocol=STATELESS
spring.ai.mcp.server.name=graphnous
spring.ai.mcp.server.streamable-http.mcp-endpoint=/mcp
spring.ai.mcp.server.instructions=Graphnous scans the source code of software systems into a graph. \
  A system is made up of projects, each a git repository or a directory in one; \
  a scan reads a project's code at a revision. \
  For a file of the repository the user is working on, start with findFile, with the repository's git url \
  and the file's path in it. Otherwise find a project's newest COMPLETED scan with listSystems, listProjects \
  and listScans, then look in that scan's graph. \
  Before changing a method, use findUsages to see what uses it, \
  in this project and, over HTTP, in the other projects of its system. \
  Before changing an HTTP endpoint, use listEndpoints to see every call of it in the system; \
  listUnmatchedCalls lists the calls that reach none of its endpoints. \
  To see what a branch changes, and what that affects, analyze the newest COMPLETED scan of main against \
  that of the branch, from listScans with the branch, with analyzeImpact; compareScans lists every change.
