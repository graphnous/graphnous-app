# Merged over application.yml. On startup the server stops the containers of
# its instance; a separate name keeps tests away from a server running on the
# same Docker daemon.
graphnous.scanner.instance=graphnous-test

# The controller tests mock the repositories, so an in-memory database with
# a generated schema will do; RepositoriesTest runs the Flyway migrations on
# PostgreSQL instead
spring.datasource.url=jdbc:h2:mem:graphnous;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
