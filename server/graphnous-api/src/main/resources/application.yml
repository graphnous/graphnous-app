server:
  port: 1337

management:
  endpoints:
    web:
      exposure:
        # Only the health, at /actuator/health: UP once the server, its
        # databases and Neo4j are, for the checks of a container platform
        include: health

spring:
  neo4j:
    uri: ${NEO4J_URI:bolt://localhost:8687}
    authentication:
      username: ${NEO4J_USERNAME:neo4j}
      password: ${NEO4J_PASSWORD:changeme}
  datasource:
    # Defaults to the PostgreSQL of docker-compose.neo4j.yml, published on 8432
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:8432}/${POSTGRES_DB:graphnous}
    username: ${POSTGRES_USER:graphnous}
    password: ${POSTGRES_PASSWORD:graphnous}

  servlet:
    multipart:
      # Uploaded scan results; a large project's results run to many MB
      max-file-size: ${GRAPHNOUS_UPLOAD_MAX_FILE_SIZE:100MB}
      max-request-size: ${GRAPHNOUS_UPLOAD_MAX_REQUEST_SIZE:500MB}
  jpa:
    hibernate:
      # The schema is Flyway's (db/migration)
      ddl-auto: validate
    show-sql: false
graphnous:
  security:
    # Off: anyone may use the API, in one fixed organization, as in the
    # open-source container. On: only users of the Graphnous platform, with
    # its access tokens, each in the organization they logged in to
    enabled: ${GRAPHNOUS_SECURITY_ENABLED:false}
    # The platform, which issues the access tokens
    issuer-uri: ${GRAPHNOUS_PLATFORM_URL:http://localhost:1338}
  enhancers:
    # The enhancer manifests the server installs on startup
    location: classpath*:enhancers/*.json
  scans:
    # An active scan without a status change for this long is failed, as
    # are scans a previous run of the server left active
    timeout: 1h
    recovery-interval: 1m
  scanner:
    # Labels the containers this server starts. On startup the server stops
    # the containers a previous run left, so give servers sharing a Docker
    # daemon different names.
    instance: graphnous
    # Repositories are checked out in a git container into this workspace,
    # which the scanner containers then mount. With type volume the server
    # must have the volume mounted at path; use type host with a directory
    # on the Docker host when running the server directly on it.
    workspace:
      type: ${GRAPHNOUS_WORKSPACE_TYPE:host}
      volume: ${GRAPHNOUS_WORKSPACE_VOLUME:graphnous-checkouts}
      path: ${GRAPHNOUS_WORKSPACE_PATH:${user.home}/graphnous-checkouts}
    git-image: alpine/git:2.54.0
  ai:
    openai:
      # The key of the assistant at ag-ui.server.path; without one, every
      # run of it ends in an error
      api-key: ${OPENAI_API_KEY:}
      model: ${GRAPHNOUS_AI_MODEL:gpt-5}
      # The model of the impact agent, which the assistant asks what a
      # change risks breaking; the assistant's unless set
      impact-model: ${GRAPHNOUS_AI_IMPACT_MODEL:${graphnous.ai.openai.model}}
  # The scanner for each language: its image, the command running it (in
  # place of the image's entrypoint) and where it writes its result. The
  # command's {repository}, {target}, {languageVersion} and {output} are
  # replaced for each target; an unknown language version is empty. A
  # scanner may also mount volumes or host paths, get environment variables,
  # and get files this server reads, all of which no other scanner gets.
  scanners:
    JAVA:
      image: ghcr.io/graphnous/graphnous-java-scanner:0.4.0
      command:
        - java
        # Resolving calls into the project's libraries takes a lot of
        # memory: the JVM's default quarter of the container's is too
        # little for a project of a few hundred classes
        - -XX:MaxRAMPercentage=75
        - -jar
        - /opt/graphnous/java-scanner.jar
        - --path
        - "{repository}"
        - --target
        - "{target}"
        - --java-version
        - "{languageVersion}"
        - --output
        - "{output}"
        # Downloads the libraries of the project into the Maven repository,
        # to resolve calls into them; needs access to Maven Central, or to
        # the repositories of the Maven settings below
        - --download-dependencies
      output: /output/scan-result.json
      mounts:
        # Keeps the downloaded libraries for the next scans
        - type: volume
          source: graphnous-maven
          target: /maven-repository
      # For private repositories, a Maven settings.xml with their mirrors,
      # repositories and credentials, which this server reads and copies into
      # each scanner container; the scanner reads /maven-settings/settings.xml
      # files:
      #   - source: /etc/graphnous/maven-settings.xml
      #     target: /maven-settings/settings.xml
    TYPESCRIPT:
      image: ghcr.io/graphnous/graphnous-typescript-scanner:0.3.0
      command:
        - node
        - /opt/graphnous/scanner.js
        - --path
        - "{repository}"
        - --target
        - "{target}"
        - --output
        - "{output}"
        # Downloads the type definitions of the packages the project uses
        # into the package cache, to resolve calls into them; needs access
        # to registry.npmjs.org, or to the registries of the .npmrc below
        - --download-dependencies
      output: /output/scan-result.json
      mounts:
        # Keeps the downloaded packages for the next scans
        - type: volume
          source: graphnous-npm
          target: /npm-cache
      # For private registries, an .npmrc with the registries and their
      # credentials, which this server reads and copies into each scanner
      # container; the scanner reads /npm-settings/.npmrc
      # files:
      #   - source: /etc/graphnous/npmrc
      #     target: /npm-settings/.npmrc
