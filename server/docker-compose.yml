# Runs the Graphnous server with Neo4j:
#
#   NEO4J_PASSWORD=... docker compose -f graphnous-app/server/docker-compose.yml up --build
#
# or with the variables in a .env file next to this one (see .env.example).
#
# The server checks repositories out in the graphnous-checkouts volume, and
# starts git and scanner containers that mount that same volume by name. That
# only works with the server itself in a container that has the volume
# mounted; when running the server directly on the host, use workspace type
# host instead (see application.yml).

services:
  server:
    build:
      context: ../..
      dockerfile: graphnous-app/server/Dockerfile
    ports:
      - "1337:1337"
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?Set NEO4J_PASSWORD}
    # The server runs as a non-root user, which needs the group that owns
    # the Docker socket: 0 on Docker Desktop, usually the docker group on
    # Linux (DOCKER_GID=$(stat -c %g /var/run/docker.sock))
    group_add:
      - "${DOCKER_GID:-0}"
    volumes:
      # Starts the git and scanner containers on the host's Docker daemon
      - /var/run/docker.sock:/var/run/docker.sock
      - checkouts:/checkouts
    depends_on:
      neo4j:
        condition: service_healthy

  neo4j:
    image: neo4j:5-community
    # Not published on the host: the server reaches it over the compose
    # network, and the default ports are often taken by other Neo4j instances
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD}
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  checkouts:
    # A fixed name, not prefixed with the compose project, as the server
    # passes it to the containers it starts
    name: graphnous-checkouts
  neo4j-data:
