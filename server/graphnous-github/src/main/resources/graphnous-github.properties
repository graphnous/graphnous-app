# The GitHub App, on with graphnous.github.enabled (GRAPHNOUS_GITHUB_ENABLED)
graphnous.github.app-id=${GRAPHNOUS_GITHUB_APP_ID:}
graphnous.github.private-key=${GRAPHNOUS_GITHUB_PRIVATE_KEY:}
graphnous.github.private-key-file=${GRAPHNOUS_GITHUB_PRIVATE_KEY_FILE:}
graphnous.github.webhook-secret=${GRAPHNOUS_GITHUB_WEBHOOK_SECRET:}
graphnous.github.api-url=${GRAPHNOUS_GITHUB_API_URL:https://api.github.com}
graphnous.github.organization-id=${graphnous.security.default-organization-id:00000000-0000-0000-0000-000000000000}
graphnous.github.scan-default-branch=${GRAPHNOUS_GITHUB_SCAN_DEFAULT_BRANCH:true}
graphnous.github.sweep-interval=PT1M
graphnous.github.assess=${GRAPHNOUS_GITHUB_ASSESS:false}
graphnous.github.server-url=${GRAPHNOUS_GITHUB_SERVER_URL:}
graphnous.github.webhook-url=${GRAPHNOUS_GITHUB_WEBHOOK_URL:}
